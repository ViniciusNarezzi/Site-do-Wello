        <p>&copy; 2026 Wello Tattoo. Todos os direitos reservados.</p>
    </footer>

        <span class="lightbox-close">&times;</span>
        <button class="lightbox-btn lightbox-prev">&#10094;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Tatuagem Expandida">
        </div>
        <button class="lightbox-btn lightbox-next">&#10095;</button>
    </div>

    <script src="script.js"></script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Wello Tattoo | Área Administrativa</title>
  
  <!-- Fontes do Site -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilo do Painel Admin -->
  <link rel="stylesheet" href="admin.css">

  <!-- Widget do Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Redireciona login do Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Registra os estilos dentro do IFRAME da Pré-visualização
    CMS.registerPreviewStyle("admin.css");
    CMS.registerPreviewStyle("../style.css");

    // Componente de Pré-Visualização com renderização correta de imagem
    var GaleriaPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var getAsset = this.props.getAsset;
        var trabalhos = entry.getIn(['data', 'trabalhos']);
        var items = trabalhos ? trabalhos.toJS() : [];

        return h('div', { style: { padding: '20px', backgroundColor: '#0a0a0a', minHeight: '100vh', color: '#fff' } },
          h('h2', { style: { textAlign: 'center', color: '#d4af37', fontFamily: 'Cinzel, serif', marginBottom: '10px' } }, 'PRÉ-VISUALIZAÇÃO EM TEMPO REAL'),
          h('p', { style: { textAlign: 'center', color: '#b3b3b3', fontSize: '13px', marginBottom: '30px' } }, 'Assim é como sua galeria vai aparecer no site principal:'),
          h('div', { className: 'grid-galeria' },
            items.map(function(item, index) {
              var imgSrc = item.imagem ? getAsset(item.imagem).toString() : '';
              return h('div', { key: index },
                imgSrc ? h('img', { 
                  src: imgSrc, 
                  alt: item.alt || 'Tatuagem Wello Tattoo'
                }) : h('div', { style: { height: '250px', background: '#1c1c1c', border: '1px dashed #d4af37', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#b3b3b3' } }, 'Sem imagem')
              );
            })
          )
        );
      }
    });

    CMS.registerPreviewTemplate("galeria", GaleriaPreview);
  </script>
</body>
</html>
